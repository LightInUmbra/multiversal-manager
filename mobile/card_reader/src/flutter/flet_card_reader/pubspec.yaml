name: flet_card_reader
description: Reads the text on a photo with Google ML Kit, for the Multiversal Manager card scanner
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flet: ^1.0.1
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.17.1
  path_provider: ^2.1.6
