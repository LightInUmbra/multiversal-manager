# Pushing a version tag (git tag v1.1.0 && git push origin v1.1.0) tests the code, rebuilds
# the interaction data, builds the installer and the portable zip on Windows, and publishes
# them as a GitHub Release, then builds the Android app and adds its APK to that release,
# and builds the website and publishes it on GitHub Pages (https://multiversalmanager.app)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen

      # Which cards work together (interactions.py), rebuilt from Scryfall's newest card data
      # and rulings so every release ships up-to-date data; the Android build reuses the file
      - name: Rebuild the interaction data
        run: python interactions.py build --download
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8

      - uses: actions/upload-artifact@v4
        with:
          name: interactions
          path: interactions.json.gz

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer and portable zip
        shell: bash
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          python build.py

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*-setup.exe dist/*-portable.zip \
            --title "Multiversal Manager ${GITHUB_REF_NAME#v}" --generate-notes

  # The Android app, added to the same release once the Windows build has made it
  android:
    needs: release
    runs-on: windows-latest   # like the desktop build; it also has the Android SDK
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      # The interaction data the Windows build made (replacing the committed copy)
      - uses: actions/download-artifact@v4
        with:
          name: interactions

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # flet build downloads Flutter the first time (about 1 GB); keep it between releases
      - uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-flet-1.0.1

      - name: Install dependencies
        run: pip install -r requirements.txt "flet==1.0.1" "flet-cli==1.0.1"

      # The Android SDK packages flet build needs (its own installer can stop partway)
      - name: Install the Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      # The release key comes from the repository's secrets (ANDROID_KEYSTORE_BASE64 and
      # ANDROID_KEYSTORE_PASSWORD); every APK has to be signed with it to install as an update
      - name: Build the Android app
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_SIGNING_KEY_STORE="$RUNNER_TEMP/release.jks"
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          python mobile/build_apk.py

      - name: Add it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" mobile/build/Multiversal-Manager-*.apk

  # The website, built from the same code, for GitHub Pages at https://multiversalmanager.app
  website:
    needs: release
    runs-on: windows-latest   # like the Android build, whose Flutter download it shares
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      # The interaction data the Windows build made
      - uses: actions/download-artifact@v4
        with:
          name: interactions

      - uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-flet-1.0.1

      # The rules from the last release, so only what changed downloads again (set notes take a while)
      - uses: actions/cache@v4
        with:
          path: rules
          key: rules-${{ github.run_id }}
          restore-keys: rules-

      - name: Install dependencies
        run: pip install -r requirements.txt "flet==1.0.1" "flet-cli==1.0.1"

      # Browsers can't download the rules from Wizards of the Coast, so the website comes with
      # them (mobile/build_web.py bundles this folder); a runner isn't a browser
      - name: Download the rules
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python -c "import database as db, rules; db.create_table(); changed, errors = rules.update(); print('Changed:', changed, 'Errors:', errors)"

      - name: Build the website
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          python mobile/build_web.py

      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: mobile/build/web

  # Publishing it (on Linux, where GitHub's Pages actions run)
  pages:
    needs: website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
