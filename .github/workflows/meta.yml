# Once a week: reads the last 30 days of MTGO decklists that Wizards publishes and publishes a
# small file per format (what's played, and what's played together) on the meta-data branch,
# where the apps read it for their constructed recommendations (see meta.py). The branch holds
# only these files and is replaced each time; main is never touched.
name: MTGO meta

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:       # and on demand, from the Actions tab

permissions:
  contents: write          # to push the meta-data branch

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # a month of events at a polite pace takes roughly 20-40 minutes
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Read the decklists
        run: |
          pip install requests
          python -u meta.py build out   # -u: progress shows as it happens, not at the end

      - name: Publish to the meta-data branch
        working-directory: out
        run: |
          git init -q -b meta-data
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "MTGO meta, $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" meta-data
